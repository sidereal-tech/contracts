[notes]
admin_custody = "single key = the deployer key (in the local stellar-cli keystore). Only lever is the constrained migrate_reserve_index. Can be imported into a mobile wallet."
maturity_ttl = "contract code/instance entries provisioned at the mainnet minimum persistent TTL (120 days). MEASURED 2026-08-17: the vault instance entry expires at ledger 65488004 and Blend's Positions(vault) entry at 65489595 -- both around 2026-11-11. The original 'no renewal needed for a one-shot cycle' note holds ONLY if every holder exits before then; it is not true for a position left outstanding. Funds are recoverable either way (RestoreFootprint is permissionless) but the app offers no restore path. A zero-value self-approve renews the vault instance for free; only a value-moving deposit or redeem renews Blend's entry."
keeper = "this market predates the per-market layout under deployments/markets/, so scripts/keeper.mjs could not see it and its 2026-08-09 maturity passed with the rate unfrozen. keeper.mjs now loads it explicitly as a legacy market; mainnet upkeep needs MAINNET_RPC_URL set, because the stellar-cli mainnet alias ships with no RPC URL."
