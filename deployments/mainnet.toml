# Sidereal mainnet deployment manifest.
# Public deployment metadata only. Do not add private keys.
# Deployed 2026-07-10 from clean source commit 67151f8 (contract source; the
# working tree had only non-source files dirty — testnet manifests and docs).
# All five wasm hashes were verified equal to the on-chain code hashes.

# Retired 2026-08-18. The pilot matured 2026-08-09 having proven what it was for
# (five immutable contracts, real funds, a full lifecycle on mainnet) and is not
# being wound down or migrated -- V2 deploys at new addresses regardless. The
# keeper skips retired markets, so it does not warn forever about upkeep nobody
# intends to perform. Kept as deployment provenance.
#
# Consequence, recorded rather than left implicit: the maturity rate was never
# frozen and can no longer be improved (`observe_rate` is gated on a live
# market), so if anyone ever does redeem here, YT settles at roughly 2% of what
# it earned and the remainder goes to PT. Total value at stake is ~$10.70, of
# which the deployer holds 96% of the YT and the AMM holds 96% of the PT.
